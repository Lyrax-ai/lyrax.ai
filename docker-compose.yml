version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lyrax-postgres
    environment:
      POSTGRES_DB: lyrax_dev
      POSTGRES_USER: lyrax_user
      POSTGRES_PASSWORD: lyrax_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrax_user -d lyrax_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lyrax-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lyrax_user:lyrax_dev_pass@db:5432/lyrax_dev
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: